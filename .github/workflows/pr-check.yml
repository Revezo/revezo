name: PR Check

on:
    pull_request:
        branches: 
            - main
            - develop

jobs:
    ci:
        name: Lint & Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '22'

            - name: Install dependencies
              run: npm install

            - name: Run ESLint
              run: npx expo lint -- --no-fix

            - name: Check TypeScript compilation
              run: npx tsc --noEmit